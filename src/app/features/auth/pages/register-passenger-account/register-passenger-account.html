<div class="register-container">
  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <img src="assets/logo.png" alt="Logo">
      <h1>UniRide</h1>
    </div>

    <!-- Steps -->
    <div class="steps">

      <div class="step">
        <div class="circle active"></div>
        <span class="label">Datos</span>
      </div>

      <div class="line"></div>

      <div class="step">
        <div class="circle active"></div>
        <span class="label">Cuenta</span>
      </div>

    </div>



    <h2>Crear una cuenta</h2>

    <form>
      <label>Código Universitario</label>
      <input type="text" placeholder="Empty label" [(ngModel)]="codigo" name="codigo"/>

      <label>Email</label>
      <input type="email" placeholder="Empty label" [(ngModel)]="email" name="email"/>

      <label>Contraseña</label>
      <input type="password" placeholder="Empty label" [(ngModel)]="password" name="password"/>

      <label>Confirmar contraseña</label>
      <input type="password" placeholder="Empty label" [(ngModel)]="password2" name="password2"/>

      <button type="button" (click)="createAccount()">Crear Cuenta</button>
    </form>

    <hr />

    <p>¿Ya tienes una cuenta? <a routerLink="/auth/login">Accede a tu cuenta</a></p>
  </div>
</div>
