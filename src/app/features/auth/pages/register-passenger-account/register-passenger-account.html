<div class="register-container">
  <div class="card">

    <!-- Logo -->
    <div class="logo">
      <img src="assets/logo.png" alt="Logo">
      <h1>UniRide</h1>
    </div>

    <!-- Steps -->
    <div class="steps">
      <div class="step">
        <div class="circle active"></div>
        <span class="label">Datos</span>
      </div>

      <div class="line"></div>

      <div class="step">
        <div class="circle active"></div>
        <span class="label">Cuenta</span>
      </div>
    </div>

    <h2>Crear una cuenta</h2>

    <form [formGroup]="accountForm">

      <!-- Código Universitario -->
      <label>Código Universitario</label>
      <input type="text" placeholder="Empty label" formControlName="codigo" />
      <p class="error" *ngIf="accountForm.get('codigo')?.touched && accountForm.get('codigo')?.invalid">
        * Código inválido (mínimo 6 caracteres).
      </p>

      <!-- Email -->
      <label>Email</label>
      <input type="email" placeholder="Empty label" formControlName="email" />
      <p class="error" *ngIf="accountForm.get('email')?.touched && accountForm.get('email')?.invalid">
        * Ingresa un email válido.
      </p>

      <!-- Contraseña -->
      <label>Contraseña</label>
      <div class="input-with-icon">
        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Empty label"
          formControlName="password"
        />

        <button
          type="button"
          class="toggle-password-btn"
          (click)="togglePassword()"
          aria-label="Mostrar u ocultar contraseña"
        >
          <img
            [src]="showPassword ? 'assets/ojo_abierto.png' : 'assets/ojo_bloqueado.png'"
            alt="Icono mostrar/ocultar contraseña"
          />
        </button>
      </div>
      <p class="error" *ngIf="accountForm.get('password')?.touched && accountForm.get('password')?.invalid">
        * La contraseña debe tener al menos 6 caracteres.
      </p>

      <!-- Confirmar Contraseña -->
      <label>Confirmar contraseña</label>
      <div class="input-with-icon">
        <input
          [type]="showPassword2 ? 'text' : 'password'"
          placeholder="Empty label"
          formControlName="password2"
        />

        <button
          type="button"
          class="toggle-password-btn"
          (click)="togglePassword2()"
          aria-label="Mostrar u ocultar confirmación de contraseña"
        >
          <img
            [src]="showPassword2 ? 'assets/ojo_abierto.png' : 'assets/ojo_bloqueado.png'"
            alt="Icono mostrar/ocultar contraseña"
          />
        </button>
      </div>
      <p class="error"
         *ngIf="accountForm.get('password2')?.touched && accountForm.hasError('mismatch')">
        * Las contraseñas no coinciden.
      </p>

      <button type="button"
              class="form-main-btn"
              (click)="createAccount()"
              [disabled]="accountForm.invalid">
        Crear Cuenta
      </button>

    </form>

    <hr />

    <p>¿Ya tienes una cuenta?
      <a routerLink="/auth/login">Accede a tu cuenta</a>
    </p>

  </div>
</div>
